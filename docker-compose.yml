networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/22
services:
  # Optional analytics (not used by the live bot): start with
  #   docker-compose --profile analytics up -d
  data-collector:
    profiles: ["analytics"]
    build: .
    image: aster_market_making:latest
    container_name: aster_data_collector
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 256
    env_file:
      - runtime.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # Mount entire directory so ASTER_data/ files are accessible both inside and outside container
      # This ensures data collector works identically whether run natively or with Docker
      # - Native: saves to ./ASTER_data/ relative to script location
      # - Docker: saves to /app/ASTER_data/ which maps back to ./ASTER_data/ on host
      - ./:/app/
    command: python data_collector.py
    restart: unless-stopped

  market-maker:
    build: .
    image: aster_market_making:latest
    container_name: aster_market_maker
    stop_grace_period: 45s
    env_file:
      - aster.env
      - runtime.env
    environment:
      - PYTHONUNBUFFERED=1
      - RELEASE_MODE=0
    volumes:
      - ./:/app/
    command: python market_maker.py
    restart: unless-stopped
